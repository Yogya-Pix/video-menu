services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: videomenu
      POSTGRES_PASSWORD: videomenu
      POSTGRES_DB: videomenu
    ports:
      - "5432:5432"
    volumes:
      - videomenu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videomenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  videomenu_postgres_data:
